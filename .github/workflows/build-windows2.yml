name: Build Windows (Simplified)

on:
  release:
    types: [published]
  workflow_dispatch:  # 添加这行，允许手动触发

jobs:
  deploy:
    strategy:
      fail-fast: false
      matrix:
        cfg:
          - { os: windows-2022, python-version: '3.11', architecture: x64 }
          # - { os: windows-11-arm, python-version: '3.11', architecture: arm64 }  # ARM64 暂时注释，需要 MSVC

    runs-on: ${{ matrix.cfg.os }}
    defaults:
      run:
        shell: bash

    steps:
    - name: Clone
      uses: actions/checkout@v4  # 用 v4 而不是 v6

    - name: Set up Python ${{ matrix.cfg.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.cfg.python-version }}
        architecture: ${{ matrix.cfg.architecture }}

    - name: Install dependencies
      run: |
        pip install pyinstaller~=6.18 build

    - name: Build Wheels
      shell: pwsh
      run: |
        $env:BDISTWHEELFREEZELIBS = "true"
        python -m build
        
    - name: Install Wheels
      run: |
        python -m pip install dist/amulet_map_editor-*.whl --upgrade

    - name: PyInstaller build
      run: |
        python -m PyInstaller -y --distpath ./installer/dist installer/Amulet.spec

    # NSIS 安装程序打包（可选）
    - name: Windows - Install NSIS
      uses: repolevedavaj/install-nsis@v1.1.0
      with:
        nsis-version: '3.11'

    - name: Windows - Create Installer (no signing)
      run: |
        makensis -DVERSION=${{ github.event.release.tag_name }} -DARCH=${{ matrix.cfg.architecture }} installer/windows.nsi

    - name: Upload Release Asset
      uses: actions/upload-artifact@v4
      with:
        name: Amulet-${{ github.event.release.tag_name }}-${{ runner.os }}-${{ matrix.cfg.architecture }}
        path: ./installer/dist
